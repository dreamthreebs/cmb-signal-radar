name: Update papers and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/update-and-deploy.yml"
  schedule:
    # 12:35 in Beijing (UTC+8). arXiv only needs to be queried once per day.
    - cron: "35 4 * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "即使没有新论文，也重新分析当前精选"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cmb-signal-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.finalize.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check whether this run needs GPT
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GPT_API_KEY: ${{ secrets.GPT_API_KEY || secrets.OPENAI_API_KEY }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "data_run=false" >> "$GITHUB_OUTPUT"
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            echo "gate_reason=code_push" >> "$GITHUB_OUTPUT"
          elif [[ -z "$GPT_API_KEY" ]]; then
            echo "data_run=false" >> "$GITHUB_OUTPUT"
            echo "should_test=false" >> "$GITHUB_OUTPUT"
            echo "gate_reason=missing_api_key" >> "$GITHUB_OUTPUT"
          else
            echo "data_run=true" >> "$GITHUB_OUTPUT"
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            echo "gate_reason=ready" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.should_test == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.should_test == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Fetch and analyze recent papers
        id: update_papers
        if: steps.gate.outputs.data_run == 'true'
        env:
          GPT_API_KEY: ${{ secrets.GPT_API_KEY || secrets.OPENAI_API_KEY }}
          GPT_BASE_URL: ${{ secrets.GPT_BASE_URL || vars.GPT_BASE_URL || secrets.OPENAI_BASE_URL }}
          GPT_MODEL: ${{ vars.GPT_MODEL || vars.OPENAI_MODEL || 'gpt-5.6' }}
          GPT_API_MODE: ${{ vars.GPT_API_MODE || 'responses' }}
          GPT_USER_AGENT: ${{ vars.GPT_USER_AGENT }}
          GPT_BATCH_SIZE: ${{ vars.GPT_BATCH_SIZE || '3' }}
          GPT_REASONING_EFFORT: ${{ vars.GPT_REASONING_EFFORT }}
          ARXIV_CONTACT_EMAIL: ${{ vars.ARXIV_CONTACT_EMAIL }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
        run: |
          args=(--require-ai)
          if [[ "$EVENT_NAME" == "schedule" || "$FORCE_REFRESH" != "true" ]]; then
            args+=(--skip-if-no-new)
          else
            args+=(--force-ai)
          fi
          python scripts/update_papers.py --config config/radar.json --output site/data/papers.json "${args[@]}"

      - name: Test the data pipeline
        if: steps.gate.outputs.should_test == 'true'
        run: python -m unittest discover -s tests -v

      - name: Preserve daily history
        if: steps.update_papers.outputs.changed == 'true'
        run: |
          git config user.name "cmb-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/papers.json
          git commit -m "data: refresh paper radar"
          git push origin HEAD:main

      - name: Decide whether to deploy
        id: finalize
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATA_CHANGED: ${{ steps.update_papers.outputs.changed || 'false' }}
          UPDATE_REASON: ${{ steps.update_papers.outputs.reason || steps.gate.outputs.gate_reason }}
        run: |
          if [[ "$EVENT_NAME" == "push" || "$DATA_CHANGED" == "true" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            deploy_label="yes"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            deploy_label="no"
          fi
          echo "### CMB Signal automation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: $UPDATE_REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy: $deploy_label" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        if: steps.finalize.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: steps.finalize.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    if: needs.update.outputs.should_deploy == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
