name: Update papers and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/update-and-deploy.yml"
  schedule:
    # 12:35 in Beijing (UTC+8). arXiv only needs to be queried once per day.
    - cron: "35 4 * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "即使没有新论文，也重新分析当前精选"
        required: false
        type: boolean
        default: true
      backfill_days:
        description: "历史回填天数；日常运行填 0"
        required: false
        type: string
        default: "0"
      analysis_cap:
        description: "本次最多分析多少篇历史论文"
        required: false
        type: string
        default: "18"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: cmb-signal-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.finalize.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check whether this run needs GPT
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GPT_API_KEY: ${{ secrets.GPT_API_KEY || secrets.OPENAI_API_KEY }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "data_run=false" >> "$GITHUB_OUTPUT"
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            echo "gate_reason=code_push" >> "$GITHUB_OUTPUT"
          elif [[ -z "$GPT_API_KEY" ]]; then
            echo "data_run=false" >> "$GITHUB_OUTPUT"
            echo "should_test=false" >> "$GITHUB_OUTPUT"
            echo "gate_reason=missing_api_key" >> "$GITHUB_OUTPUT"
          else
            echo "data_run=true" >> "$GITHUB_OUTPUT"
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            echo "gate_reason=ready" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.should_test == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.should_test == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Fetch and analyze recent papers
        id: update_papers
        if: steps.gate.outputs.data_run == 'true'
        env:
          GPT_API_KEY: ${{ secrets.GPT_API_KEY || secrets.OPENAI_API_KEY }}
          GPT_BASE_URL: ${{ secrets.GPT_BASE_URL || vars.GPT_BASE_URL || secrets.OPENAI_BASE_URL }}
          GPT_MODEL: ${{ vars.GPT_MODEL || vars.OPENAI_MODEL || 'gpt-5.6' }}
          GPT_API_MODE: ${{ vars.GPT_API_MODE || 'responses' }}
          GPT_USER_AGENT: ${{ vars.GPT_USER_AGENT }}
          GPT_BATCH_SIZE: ${{ vars.GPT_BATCH_SIZE || '3' }}
          GPT_REASONING_EFFORT: ${{ vars.GPT_REASONING_EFFORT }}
          ARXIV_CONTACT_EMAIL: ${{ vars.ARXIV_CONTACT_EMAIL }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
          ANALYSIS_CAP: ${{ inputs.analysis_cap || '18' }}
        run: |
          args=(--require-ai)
          if [[ "$BACKFILL_DAYS" =~ ^[1-9][0-9]*$ ]]; then
            args+=(--backfill-days "$BACKFILL_DAYS" --analysis-cap "$ANALYSIS_CAP")
          elif [[ "$EVENT_NAME" == "schedule" || "$FORCE_REFRESH" != "true" ]]; then
            args+=(--skip-if-no-new)
          else
            args+=(--force-ai)
          fi
          python scripts/update_papers.py --config config/radar.json --output site/data/papers.json "${args[@]}"

      - name: Test the data pipeline
        id: tests
        if: steps.gate.outputs.should_test == 'true'
        run: python -m unittest discover -s tests -v

      - name: Preserve daily history
        if: steps.update_papers.outputs.changed == 'true'
        run: |
          git config user.name "cmb-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/papers.json
          git commit -m "data: refresh paper radar"
          git push origin HEAD:main

      - name: Decide whether to deploy
        id: finalize
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATA_CHANGED: ${{ steps.update_papers.outputs.changed || 'false' }}
          UPDATE_REASON: ${{ steps.update_papers.outputs.reason || steps.gate.outputs.gate_reason }}
          UPDATE_OUTCOME: ${{ steps.update_papers.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          incident="false"
          incident_reason=""

          if [[ "$UPDATE_OUTCOME" == "failure" ]]; then
            incident="true"
            incident_reason="update_step_failed"
          elif [[ "$TEST_OUTCOME" == "failure" ]]; then
            incident="true"
            incident_reason="tests_failed"
          elif [[ "$UPDATE_REASON" =~ ^(missing_api_key|ai_error|arxiv_unavailable)$ ]]; then
            incident="true"
            incident_reason="$UPDATE_REASON"
          fi

          if [[ "$incident" == "false" && ( "$EVENT_NAME" == "push" || "$DATA_CHANGED" == "true" ) ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            deploy_label="yes"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            deploy_label="no"
          fi

          echo "incident=$incident" >> "$GITHUB_OUTPUT"
          echo "incident_reason=$incident_reason" >> "$GITHUB_OUTPUT"
          if [[ "$incident" == "false" && "$EVENT_NAME" != "push" && "$UPDATE_REASON" == "updated" ]]; then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
          else
            echo "recovered=false" >> "$GITHUB_OUTPUT"
          fi

          echo "### CMB Signal automation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: $UPDATE_REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy: $deploy_label" >> "$GITHUB_STEP_SUMMARY"
          echo "- Incident: $incident" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        if: steps.finalize.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: steps.finalize.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Notify repository owner about automation failure
        if: always() && steps.finalize.outputs.incident == 'true'
        uses: actions/github-script@v8
        env:
          INCIDENT_REASON: ${{ steps.finalize.outputs.incident_reason }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = "⚠️ CMB Signal 自动更新异常";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "CMB Signal 已进入失败关闭状态：本次没有覆盖历史数据，也没有部署新页面。",
              "",
              `- 原因：\`${process.env.INCIDENT_REASON}\``,
              `- 触发方式：\`${context.eventName}\``,
              `- 时间：${new Date().toISOString()}`,
              `- [查看 Actions 日志](${runUrl})`,
              "",
              "修复 API Key、接口地址或服务状态后，请手动重新运行工作流；成功恢复时此 Issue 会自动关闭。",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `故障仍未恢复：[查看本次运行](${runUrl})（\`${process.env.INCIDENT_REASON}\`）。`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                assignees: [context.repo.owner],
              });
            }

      - name: Close automation alert after recovery
        if: always() && steps.finalize.outputs.recovered == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = "⚠️ CMB Signal 自动更新异常";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "API 调用与数据更新已经恢复，告警自动关闭。",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }

      - name: Fail closed after automation incident
        if: always() && steps.finalize.outputs.incident == 'true'
        run: |
          echo "Automation incident: ${{ steps.finalize.outputs.incident_reason }}"
          exit 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    if: needs.update.outputs.should_deploy == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
